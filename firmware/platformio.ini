; AirTAK — Airsoft Team Awareness Kit
; firmware/platformio.ini — PlatformIO project configuration
; Planning: §9.1, §18.1 | Roadmap: 1.1
;
; Setup: ..\tools\setup_firmware_env.ps1
; Build: ..\tools\pio_firmware.ps1 run -e t_echo_plus
; Flash: ..\tools\pio_firmware.ps1 run -e t_echo_plus -t upload  (or use ..\tools\flash.ps1)
; Test:  ..\tools\pio_firmware.ps1 test -e native
; Monitor: ..\tools\pio_firmware.ps1 device monitor -b 115200
;
; All library versions must match or exceed those listed in §18.1.

[platformio]
default_envs = t_echo_plus

; ── T-Echo Plus (primary hardware target) ────────────────────────────────────
[env:t_echo_plus]
platform       = nordicnrf52
board          = t_echo_plus
framework      = arduino

; Adafruit nRF52 Arduino BSP ≥ 1.6.1 (§18.1)
; Using the Adafruit BSP for nRF52840 — consistent with upstream Meshtastic firmware.
platform_packages =
    framework-arduinoadafruitnrf52 @ ^1.6.1

; C++17 standard (§9.1)
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_T_ECHO_PLUS
    -DBOARD_T_ECHO_PLUS
    -DMBEDTLS_CONFIG_FILE=\"mbedtls_airtak_config.h\"
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
build_src_filter =
    +<*>
    -<native_stubs/>
    -<platform/native/>

; Dependencies — versions per §18.1
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    nanopb/Nanopb @ ^0.4.8
    kochcodes/mbedtls @ ^3.6.2
    adafruit/Adafruit SPIFlash @ ^5.1.1
    ; LittleFS on nRF52 is provided by the Adafruit nRF52 Arduino BSP
    ; (InternalFileSystem / Adafruit_LittleFS) — no separate library required.
    ; FlashStore mounts Adafruit_LittleFS on external QSPI NOR through
    ; Adafruit_SPIFlash.
    ZinggJM/GxEPD2 @ ^1.5.4           ; SSD1681 e-paper driver (§9.6)

; Upload method: USB CDC or SWD via J-Link
upload_protocol = nrfjprog

; Serial monitor baud rate
monitor_speed = 115200

; Custom board definition (verified pin map — see §7.1)
board_dir = boards

; ── Native environment for unit tests (no hardware required) ─────────────────
[env:native]
platform = native
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_NATIVE_TEST
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    -I$PROJECT_DIR/src/native_stubs
build_src_filter =
    -<*>
    +<ble/Framing.cpp>
    +<ble/BLEQueue.cpp>
    +<platform/native/config/FlashStore.cpp>
    +<mesh/Crypto.cpp>
    +<mesh/Router.cpp>
    +<native_stubs/NativeStubs.cpp>
    +<platform/Platform.cpp>
    +<proto/airtak/*.pb.c>
test_build_src = yes
test_filter =
    test_config
    test_crypto
    test_framing
    test_router
test_framework = unity

; Unity test framework ≥ 2.5.2 (§18.1)
lib_deps =
    throwtheswitch/Unity @ ^2.5.2
    nanopb/Nanopb @ ^0.4.8
    kochcodes/mbedtls @ ^3.6.2
