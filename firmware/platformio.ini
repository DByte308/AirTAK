; ── LilyGo T-LoRa T3 S3 (ESP32-S3, multi-radio, secondary hardware target) ──────────
[env:t3s3]
platform       = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board          = t3s3
framework      = arduino

; Keep controller resource limits and NimBLE task-stack sizing consistent across
; ESP32-S3 targets. These are resource policy, NOT a silicon/BLE-init workaround.
custom_sdkconfig =
    CONFIG_BT_CTRL_BLE_MAX_ACT=2
    CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=10
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; Preserve AirTAK's NimBLE host headroom (LittleFS writes from the onWrite BLE
    ; callback) - must live here because a -D flag would clash with the regenerated
    ; sdkconfig.h (redefined -> -Werror on the pioarduino build).
    CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

; C++17 standard
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_T3S3
    -DBOARD_T3S3
    ; NimBLE host task stack is set in custom_sdkconfig (CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE).
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; FreeRTOS shim
    -I$PROJECT_DIR/src/platform/esp32/freertos_shim
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    ; -DAIRTAK_GPS_DEBUG
    ; Uncomment to build flash-test firmware (display shows "FLASH TEST OK"):
    ; -DAIRTAK_FLASH_TEST
build_src_filter =
   +<*>
   -<native_stubs/>
   -<platform/native/>
   -<platform/nrf52/>
    -<platform/boards/>
    +<platform/boards/t3s3/>

; Dependencies
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    nanopb/Nanopb @ ^0.4.8
    ; mbedtls is provided by Arduino-ESP32 IDF
    h2zero/NimBLE-Arduino @ ^1.4.0
    adafruit/Adafruit GFX Library @ ^1.11.0
    adafruit/Adafruit SSD1306 @ ^2.5.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    ; LittleFS is built into Arduino-ESP32 >= 2.x

; Upload via esptool (USB-CDC)
upload_protocol = esptool
upload_speed    = 460800

; Serial monitor
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Partition table and PSRAM
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Custom board definition
board_dir = boards

; ── T-Deck (ESP32-S3, secondary hardware target) ────────────────────────────────────
[env:t_deck]
platform       = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board          = t_deck
framework      = arduino

; Resource limits and NimBLE task-stack sizing, not a BLE-init workaround.
custom_sdkconfig =
    CONFIG_BT_CTRL_BLE_MAX_ACT=2
    CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=10
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; Preserve AirTAK's NimBLE host headroom (LittleFS writes from onWrite BLE callback).
    CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
    ; Move the mbedTLS Curve25519 toggle from a build flag here (a -D flag would clash
    ; with the regenerated sdkconfig.h).
    CONFIG_MBEDTLS_ECP_DP_CURVE25519_ENABLED=y

; C++17 standard; exception handling disabled for embedded
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_T_DECK
    -DBOARD_T_DECK
    ; NimBLE host task stack + mbedTLS Curve25519 are set in custom_sdkconfig.

    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; FreeRTOS shim: makes #include <FreeRTOS.h> resolve to <freertos/FreeRTOS.h>
    -I$PROJECT_DIR/src/platform/esp32/freertos_shim
    ; TFT_eSPI configuration for T-Deck ST7789 320x240 (landscape)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=38
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    -DAIRTAK_GPS_DEBUG
    ; Uncomment to build flash-test firmware (display shows "FLASH TEST OK"):
    ; -DAIRTAK_FLASH_TEST
build_src_filter =
   +<*>
   -<native_stubs/>
   -<platform/native/>
   -<platform/nrf52/>
    -<platform/boards/>
    +<platform/boards/t_deck/>

; Dependencies
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    nanopb/Nanopb @ ^0.4.8
    ; NOTE: mbedtls is intentionally NOT listed here. The Arduino-ESP32 framework
    ; ships mbedtls 3.x as part of the ESP-IDF; adding a separate mbedtls library
    ; causes config-header conflicts with esp_config.h. Use the IDF's built-in one.
    h2zero/NimBLE-Arduino @ ^1.4.0    ; BLE stack (replaces Bluefruit on nRF52)
    Bodmer/TFT_eSPI @ ^2.5.0          ; ST7789 TFT driver (replaces GxEPD2)
    ; LittleFS is built into Arduino-ESP32 >= 2.x -- no extra library needed.

; Auto-patch TFT_eSPI for ESP32-S3 SPI_PORT bug (see scripts/patch_tft_espi.py)
extra_scripts = pre:scripts/patch_tft_espi.py

; Upload via esptool (USB-CDC)
upload_protocol = esptool
upload_speed    = 460800

; Serial monitor baud rate; DTR/RTS left deasserted so opening the port does
; not trigger a hardware reset on the ESP32-S3 USB JTAG bridge.
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Partition table -- default_16MB (4 MB app, 10 MB SPIFFS for LittleFS)
; The default_16MB.csv is shipped with the Arduino-ESP32 framework.
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

