; AirTAK — Airsoft Team Awareness Kit
; firmware/platformio.ini — PlatformIO project configuration
; Planning: §9.1, §18.1 | Roadmap: 1.1
;
; Setup: ..\tools\setup_firmware_env.ps1
; Build: ..\tools\pio_firmware.ps1 run -e t_echo_plus
; Flash: ..\tools\pio_firmware.ps1 run -e t_echo_plus -t upload  (or use ..\tools\flash.ps1)
; Test:  ..\tools\pio_firmware.ps1 test -e native
; Monitor: ..\tools\pio_firmware.ps1 device monitor -b 115200
;
; All library versions must match or exceed those listed in §18.1.

[platformio]
default_envs = t_echo_plus

; ── T-Echo Plus (primary hardware target) ────────────────────────────────────
[env:t_echo_plus]
platform       = nordicnrf52
board          = t_echo_plus
framework      = arduino

; Adafruit nRF52 Arduino BSP ≥ 1.6.1 (§18.1)
; Using the Adafruit BSP for nRF52840 — consistent with upstream Meshtastic firmware.
platform_packages =
    framework-arduinoadafruitnrf52 @ ^1.6.1

; C++17 standard (§9.1)
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_T_ECHO_PLUS
    -DBOARD_T_ECHO_PLUS
    -DMBEDTLS_CONFIG_FILE=\"mbedtls_airtak_config.h\"
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    -DAIRTAK_GPS_DEBUG
build_src_filter =
    +<*>
    -<native_stubs/>
    -<platform/native/>
    -<platform/esp32/>
    -<platform/boards/t_deck/>
    -<platform/boards/heltec_t114/>
    -<platform/boards/t3s3/>

; Dependencies — versions per §18.1
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    nanopb/Nanopb @ ^0.4.8
    kochcodes/mbedtls @ ^3.6.2
    adafruit/Adafruit SPIFlash @ ^5.1.1
    ; LittleFS on nRF52 is provided by the Adafruit nRF52 Arduino BSP
    ; (InternalFileSystem / Adafruit_LittleFS) — no separate library required.
    ; FlashStore mounts Adafruit_LittleFS on external QSPI NOR through
    ; Adafruit_SPIFlash.
    ZinggJM/GxEPD2 @ ^1.5.4           ; SSD1681 e-paper driver (§9.6)

; Upload method: USB CDC or SWD via J-Link
upload_protocol = nrfjprog

; Serial monitor baud rate
monitor_speed = 115200

; Custom board definition (verified pin map — see §7.1)
board_dir = boards

; ── Heltec Mesh Node T114 (nRF52840, secondary hardware target) ─────────────────────
[env:heltec_t114]
platform       = nordicnrf52
board          = heltec_t114
framework      = arduino

; Adafruit nRF52 Arduino BSP ≥ 1.6.1 (§18.1)
platform_packages =
    framework-arduinoadafruitnrf52 @ ^1.6.1

; C++17 standard (§9.1)
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_HELTEC_T114
    -DBOARD_HELTEC_T114
    -DMBEDTLS_CONFIG_FILE=\"mbedtls_airtak_config.h\"
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    -DAIRTAK_GPS_DEBUG
build_src_filter =
    +<*>
    -<native_stubs/>
    -<platform/native/>
    -<platform/esp32/>
    -<platform/boards/t_deck/>
    -<platform/boards/t_echo_plus/>
    -<platform/boards/t3s3/>

; Dependencies — versions per §18.1
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    nanopb/Nanopb @ ^0.4.8
    kochcodes/mbedtls @ ^3.6.2
    adafruit/Adafruit SPIFlash @ ^5.1.1
    adafruit/Adafruit GFX Library @ ^1.11.0
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.12.0

; Upload method: USB CDC or SWD via J-Link
upload_protocol = nrfjprog

; Serial monitor baud rate
monitor_speed = 115200

; Custom board definition (derived from Heltec T114 upstream variant)
board_dir = boards

; ── LilyGo T-LoRa T3 S3 (ESP32-S3, multi-radio, secondary hardware target) ──────────
[env:t3s3]
platform       = espressif32
board          = t3s3
framework      = arduino

; C++17 standard
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_T3S3
    -DBOARD_T3S3
    ; NimBLE host task stack: increased from default 4KB for LittleFS writes
    ; during BLE config callbacks (same rationale as T-Deck).
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; FreeRTOS shim
    -I$PROJECT_DIR/src/platform/esp32/freertos_shim
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    ; -DAIRTAK_GPS_DEBUG
build_src_filter =
    +<*>
    -<native_stubs/>
    -<platform/native/>
    -<platform/nrf52/>
    -<platform/boards/t_echo_plus/>
    -<platform/boards/t_deck/>
    -<platform/boards/heltec_t114/>
    -<platform/boards/t3s3/>

; Dependencies
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    nanopb/Nanopb @ ^0.4.8
    ; mbedtls is provided by Arduino-ESP32 IDF
    h2zero/NimBLE-Arduino @ ^1.4.0
    adafruit/Adafruit GFX Library @ ^1.11.0
    adafruit/Adafruit SSD1306 @ ^2.5.0
    ; TinyGPS++ not needed (no GPS on this board)
    ; LittleFS is built into Arduino-ESP32 >= 2.x

; Upload via esptool (USB-CDC)
upload_protocol = esptool
upload_speed    = 460800

; Serial monitor
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Partition table and PSRAM
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Custom board definition
board_dir = boards

; ── T-Deck (ESP32-S3, secondary hardware target) ────────────────────────────────────
[env:t_deck]
platform       = espressif32
board          = t_deck
framework      = arduino

; C++17 standard; exception handling disabled for embedded
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_T_DECK
    -DBOARD_T_DECK
    ; NimBLE host task stack: default 4096 bytes is too small when LittleFS writes
    ; (FlashStore::write) are called from the onWrite BLE callback.  A stack overflow
    ; crashes the ESP32 and loses any partially-written config file.  8192 bytes gives
    ; enough headroom for LittleFS + nanopb decode + NimBLE internals.
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; FreeRTOS shim: makes #include <FreeRTOS.h> resolve to <freertos/FreeRTOS.h>
    -I$PROJECT_DIR/src/platform/esp32/freertos_shim
    ; TFT_eSPI configuration for T-Deck ST7789 320x240 (landscape)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=38
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    -DAIRTAK_GPS_DEBUG
build_src_filter =
    +<*>
    -<native_stubs/>
    -<platform/native/>
    -<platform/nrf52/>
    -<platform/boards/t_echo_plus/>
    -<platform/boards/heltec_t114/>
    -<platform/boards/t3s3/>

; Dependencies
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    nanopb/Nanopb @ ^0.4.8
    ; NOTE: mbedtls is intentionally NOT listed here. The Arduino-ESP32 framework
    ; ships mbedtls 3.x as part of the ESP-IDF; adding a separate mbedtls library
    ; causes config-header conflicts with esp_config.h. Use the IDF's built-in one.
    h2zero/NimBLE-Arduino @ ^1.4.0    ; BLE stack (replaces Bluefruit on nRF52)
    Bodmer/TFT_eSPI @ ^2.5.0          ; ST7789 TFT driver (replaces GxEPD2)
    ; LittleFS is built into Arduino-ESP32 >= 2.x -- no extra library needed.

; Auto-patch TFT_eSPI for ESP32-S3 SPI_PORT bug (see scripts/patch_tft_espi.py)
extra_scripts = pre:scripts/patch_tft_espi.py

; Upload via esptool (USB-CDC)
upload_protocol = esptool
upload_speed    = 460800

; Serial monitor baud rate; DTR/RTS left deasserted so opening the port does
; not trigger a hardware reset on the ESP32-S3 USB JTAG bridge.
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Partition table -- default_16MB (4 MB app, 10 MB SPIFFS for LittleFS)
; The default_16MB.csv is shipped with the Arduino-ESP32 framework.
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; ── Native environment for unit tests (no hardware required) ─────────────────
[env:native]
platform = native
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_NATIVE_TEST
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    -I$PROJECT_DIR/src/native_stubs
build_src_filter =
    -<*>
    +<ble/Framing.cpp>
    +<ble/BLEQueue.cpp>
    +<platform/native/config/FlashStore.cpp>
    +<mesh/Crypto.cpp>
    +<mesh/Router.cpp>
    +<native_stubs/NativeStubs.cpp>
    +<platform/Platform.cpp>
    +<proto/airtak/*.pb.c>
test_build_src = yes
test_filter =
    test_config
    test_crypto
    test_framing
    test_router
test_framework = unity

; Unity test framework ≥ 2.5.2 (§18.1)
lib_deps =
    throwtheswitch/Unity @ ^2.5.2
    nanopb/Nanopb @ ^0.4.8
    kochcodes/mbedtls @ ^3.6.2
