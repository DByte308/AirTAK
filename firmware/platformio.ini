; ── Heltec WiFi LoRa 32 V4 (ESP32-S3R2, SSD1306 OLED, SX1262 + FEM) ─────────────
[env:heltec_v4]
platform       = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board          = heltec_v4
framework      = arduino
; ESP32-S3R2 has 2 MB quad-SPI PSRAM, not octal PSRAM. PSRAM allocation
; remains disabled (no BOARD_HAS_PSRAM); runtime PSRAM use is not yet verified.
board_build.arduino.memory_type = qio_qspi

; Resource policy only; BLE-init memory retention is handled in BLEServer.cpp.
; Use sdkconfig rather than -D overrides so framework and host agree.
custom_sdkconfig =
    CONFIG_BT_CTRL_BLE_MAX_ACT=2
    CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=10
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; Preserve AirTAK's NimBLE host headroom (LittleFS writes from the onWrite BLE
    ; callback). Must live here now: a -D flag would collide with the regenerated
    ; sdkconfig.h (redefined -> -Werror).
    CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

; C++17 standard
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_HELTEC_V4
    -DBOARD_HELTEC_V4
    ; NimBLE host task stack is now set in custom_sdkconfig (CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE)
    ; - a -D flag here would clash with the regenerated sdkconfig.h.
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; FreeRTOS shim
    -I$PROJECT_DIR/src/platform/esp32/freertos_shim
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    ; -DAIRTAK_GPS_DEBUG
    ; Uncomment to build flash-test firmware (display shows "FLASH TEST OK"):
    ; -DAIRTAK_FLASH_TEST
build_src_filter =
   +<*>
   -<native_stubs/>
   -<platform/native/>
   -<platform/nrf52/>
    -<platform/boards/>
    +<platform/boards/heltec_v4/>

; Dependencies
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    nanopb/Nanopb @ ^0.4.8
    ; NOTE: mbedtls is intentionally NOT listed here. The Arduino-ESP32 framework
    ; ships mbedtls 3.x as part of the ESP-IDF; adding a separate mbedtls library
    ; causes config-header conflicts.
    h2zero/NimBLE-Arduino @ ^1.4.0    ; BLE stack (replaces Bluefruit on nRF52)
    adafruit/Adafruit GFX Library @ ^1.11.0
    adafruit/Adafruit SSD1306 @ ^2.5.0
    ; LittleFS is built into Arduino-ESP32 >= 2.x -- no extra library needed.

; Upload via esptool (USB-CDC)
upload_protocol = esptool
upload_speed    = 460800

; Serial monitor
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Partition table -- default_16MB (Heltec V4 has 16 MB flash)
board_build.partitions = default_16MB.csv

; Custom board definition
board_dir = boards

; Intermediate provisioning test, NOT a universal image. Its unchanged V4 HAL
; and 16 MB partitions require a persisted heltec_v4 id before GPIO setup.
[env:heltec_v4_selection_test]
extends = env:heltec_v4
build_flags =
    ${env:heltec_v4.build_flags}
    -DAIRTAK_BOARD_SELECTION_TEST

; HAL migration compile/link fixture only. No real display backend yet, and
; upload is deliberately disabled. Do not treat this as a deployable image.
[env:runtime_hal_check]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
custom_sdkconfig =
    CONFIG_BT_CTRL_BLE_MAX_ACT=2
    CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=10
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_RUNTIME_BOARD
    -DAIRTAK_RUNTIME_HAL_COMPILE_TEST
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    -I$PROJECT_DIR/src/platform/esp32/freertos_shim
build_src_filter =
    +<*>
    -<native_stubs/>
    -<platform/native/>
    -<platform/nrf52/>
    -<platform/boards/>
    +<platform/boards/esp32s3_runtime/>
lib_deps = ${env:heltec_v4.lib_deps}
upload_protocol = custom
upload_port = DO_NOT_UPLOAD_HAL_FIXTURE
upload_command = "$PYTHONEXE" -c "import sys; sys.exit('Upload disabled: runtime_hal_check has no display backend')"
monitor_speed = 115200

; Shared ESP32-S3 runtime image that links the real display dispatcher plus the
; OLED and TFT backends. Compile/link only; i is a dispatch feasibility check, not
; a deployable image. Board negotiated from the sealed startup descriptor.
[env:runtime_s3_shared]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
custom_sdkconfig =
    CONFIG_BT_CTRL_BLE_MAX_ACT=2
    CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=10
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_RUNTIME_BOARD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI compile-time wiring used by the TFT backend compatibility check
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=38
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    -I$PROJECT_DIR/src/platform/esp32/freertos_shim
build_src_filter =
    +<*>
    -<native_stubs/>
    -<platform/native/>
    -<platform/nrf52/>
    -<platform/boards/>
    +<platform/boards/esp32s3_runtime/>
    +<platform/boards/heltec_v4/hal/Display.cpp>
    +<platform/boards/t_deck/hal/Display.cpp>
lib_deps =
    ${env:heltec_v4.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.34
upload_protocol = custom
upload_port = DO_NOT_UPLOAD_SHARED_IMAGE
upload_command = "$PYTHONEXE" -c "import sys; sys.exit('Upload disabled: runtime_s3_shared is a compile/link dispatch check')"
monitor_speed = 115200

; ── Native environment for unit tests (no hardware required) ─────────────────

[env:native]
platform = native
extra_scripts = scripts/windows_native_bcrypt.py
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_NATIVE_TEST
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    -I$PROJECT_DIR/src/native_stubs
build_src_filter =
    -<*>
    +<ble/Framing.cpp>
    +<ble/BLEQueue.cpp>
    +<platform/native/config/FlashStore.cpp>
