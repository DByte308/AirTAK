; AirTAK — Airsoft Team Awareness Kit
; firmware/platformio.ini — PlatformIO project configuration
; Planning: §9.1, §18.1 | Roadmap: 1.1
;
; Setup: ..\tools\setup_firmware_env.ps1
; Build: ..\tools\pio_firmware.ps1 run -e t_echo
; Flash: ..\tools\pio_firmware.ps1 run -e t_echo -t upload  (or use ..\tools\flash.ps1)
; Test:  ..\tools\pio_firmware.ps1 test -e native
; Monitor: ..\tools\pio_firmware.ps1 device monitor -b 115200
;
; All library versions must match or exceed those listed in §18.1.

[platformio]
default_envs = t_echo

; ── T-Echo (base / v1.0, primary hardware target) ─────────────────────────────
[env:t_echo]
platform       = nordicnrf52
board          = t_echo
framework      = arduino

; Adafruit nRF52 Arduino BSP >= 1.6.1
platform_packages =
    framework-arduinoadafruitnrf52 @ ^1.6.1

; C++17 standard
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_T_ECHO
    -DBOARD_T_ECHO
    -DMBEDTLS_CONFIG_FILE=\"mbedtls_airtak_config.h\"
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    -DAIRTAK_GPS_DEBUG
    ; Uncomment to build flash-test firmware (display shows "FLASH TEST OK"):
    ; -DAIRTAK_FLASH_TEST
build_src_filter =
   +<*>
   -<native_stubs/>
   -<platform/native/>
   -<platform/esp32/>
    -<platform/boards/>
    +<platform/boards/t_echo/>

; Dependencies
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    nanopb/Nanopb @ ^0.4.8
    kochcodes/mbedtls @ ^3.6.2
    adafruit/Adafruit SPIFlash @ ^5.1.1
    ZinggJM/GxEPD2 @ ^1.5.4

; Upload method: USB DFU via adafruit-nrfutil (bootloader mode)
upload_protocol = nrfutil
upload_speed = 115200

; Serial monitor baud rate
monitor_speed = 115200

; Custom board definition
board_dir = boards

; ── T-Echo Plus (nRF52840, secondary hardware target) ─────────────────────────
[env:t_echo_plus]
platform       = nordicnrf52
board          = t_echo_plus
framework      = arduino

; Adafruit nRF52 Arduino BSP ≥ 1.6.1 (§18.1)
; Using the Adafruit BSP for nRF52840 — consistent with upstream Meshtastic firmware.
platform_packages =
    framework-arduinoadafruitnrf52 @ ^1.6.1

; C++17 standard (§9.1)
build_flags =
    -std=c++17
    -std=gnu++17
    -DAIRTAK_FIRMWARE
    -DAIRTAK_BOARD_T_ECHO_PLUS
    -DBOARD_T_ECHO_PLUS
    -DMBEDTLS_CONFIG_FILE=\"mbedtls_airtak_config.h\"
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src/proto
    ; Uncomment for Phase 7 PTT audio build:
    ; -DAIRTAK_PHASE7_AUDIO
    ; Uncomment to print GPS diagnostics to USB serial every 10 s:
    -DAIRTAK_GPS_DEBUG
    ; Uncomment to build flash-test firmware (display shows "FLASH TEST OK"):
    ; -DAIRTAK_FLASH_TEST
build_src_filter =
   +<*>
   -<native_stubs/>
   -<platform/native/>
   -<platform/esp32/>
    -<platform/boards/>
    +<platform/boards/t_echo_plus/>
; Dependencies — versions per §18.1
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    nanopb/Nanopb @ ^0.4.8
    kochcodes/mbedtls @ ^3.6.2
    adafruit/Adafruit SPIFlash @ ^5.1.1
    ; LittleFS on nRF52 is provided by the Adafruit nRF52 Arduino BSP
    ; (InternalFileSystem / Adafruit_LittleFS) — no separate library required.
    ; FlashStore mounts Adafruit_LittleFS on external QSPI NOR through
    ; Adafruit_SPIFlash.
    ZinggJM/GxEPD2 @ ^1.5.4           ; SSD1681 e-paper driver (§9.6)

; Upload method: USB DFU via adafruit-nrfutil (bootloader mode)
upload_protocol = nrfutil
upload_speed = 115200

; Serial monitor baud rate
monitor_speed = 115200

; Custom board definition (verified pin map — see §7.1)
board_dir = boards

