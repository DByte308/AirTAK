# AirTAK CI — Forgejo Actions
# Builds all firmware targets + native tests, and Android debug APK + unit tests.
# Both jobs run in parallel. Artifacts are published for every push.
#
# Firmware targets:
#   t_echo_plus  — nRF52840 (Adafruit BSP) → firmware.hex
#   heltec_t114  — nRF52840 (Adafruit BSP) → firmware.hex
#   heltec_v3    — ESP32-S3  (ESP-IDF)     → firmware.bin
#   t_deck       — ESP32-S3  (ESP-IDF)     → firmware.bin
#   t3s3         — ESP32-S3  (ESP-IDF)     → firmware.bin
#   native       — host unit tests (Unity)
#
# Runner requirements:
#   - `runs-on` label must match your Forgejo runner. Default labels:
#       * Docker executor:  ubuntu-22.04, ubuntu-latest, docker
#       * Self-hosted:      use the label(s) you registered (e.g. linux, ci)
#   - Minimum resources: 4 vCPU, 8 GB RAM, 20 GB disk (Android SDK ~2 GB)
#   - The runner must have python3, bash, curl, unzip, and sudo in the image.
#
# ── Test gates ────────────────────────────────────────────────────────────
# JUnit 5 silently skips a @Test whose return type is not Unit; gradle alone reports green
# for a suite that ran nothing. These gates fail CI when tests are not run or discovered
# (DByte308/AirTAK#12).
#   * Fresh results: debug test-results dir is deleted before rerun, and the audit only runs
#     on a --rerun-tasks execution, so it never reads a reused report.
#   * Audit gate: `tools/audit_test_discovery.py` compares @Test declarations in
#     `android/app/src/test/**/*.kt` vs the JUnit XML the debug task produced. Exit 0 = all
#     declared tests executed; 1 = zero executed, declared-but-never-executed, or unparseable
#     @Test; 2 = results dir absent. Gated (no continue-on-error); a missing audit fails the job.
#   * Python tooling canary (separate job, no JDK/SDK): runs offline stdlib-only guards
#     `tools/test_audit_test_discovery.py` (audit self-test) and
#     `tools/test_tile_fetch.py` (T.6). Both build fixtures / inject a fake fetch rather than
#     contact a tile server. Kept separate from the gradle audit gate.

name: AirTAK CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Firmware: build all targets + run native unit tests ────────────────────
  firmware:
    name: Firmware (all targets + native tests)
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache firmware venv + libraries
        uses: actions/cache@v3
        with:
          path: |
            firmware/.venv
            ~/.platformio
            firmware/.pio/libdeps
          key: firmware-deps-v2-${{ hashFiles('firmware/requirements-dev.txt', 'firmware/platformio.ini') }}
          restore-keys: |
            firmware-deps-

      - name: Install Python venv
        run: apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip

      - name: Setup firmware environment
        run: |
          bash ./tools/setup_firmware_env.sh
          echo "$(pwd)/firmware/.venv/bin" >> "$GITHUB_PATH"

      - name: Run native unit tests
        run: bash ./tools/pio_firmware.sh test -e native

      - name: Build t_echo_plus (nRF52840)
        run: bash ./tools/pio_firmware.sh run -e t_echo_plus

      - name: Build t_echo (nRF52840)
        run: bash ./tools/pio_firmware.sh run -e t_echo

      - name: Build heltec_t114 (nRF52840)
        run: bash ./tools/pio_firmware.sh run -e heltec_t114

      - name: Build heltec_v3 (ESP32-S3)
        run: |
          firmware/.venv/bin/platformio pkg install -d firmware -e heltec_v3 --silent
          python3 firmware/scripts/patch_tft_espi_standalone.py heltec_v3
          bash ./tools/pio_firmware.sh run -e heltec_v3

      - name: Build t_deck (ESP32-S3)
        run: |
          firmware/.venv/bin/platformio pkg install -d firmware -e t_deck --silent
          python3 firmware/scripts/patch_tft_espi_standalone.py t_deck
          bash ./tools/pio_firmware.sh run -e t_deck

      - name: Build t3s3 (ESP32-S3)
        run: |
          firmware/.venv/bin/platformio pkg install -d firmware -e t3s3 --silent
          python3 firmware/scripts/patch_tft_espi_standalone.py t3s3
          bash ./tools/pio_firmware.sh run -e t3s3
        
      - name: Generate UF2 files (nRF52 targets)
        run: |
          curl -sSfLo /tmp/uf2conv.py https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
          curl -sSfLo /tmp/uf2families.json https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json
          for board in t_echo t_echo_plus heltec_t114; do
            hex="firmware/.pio/build/${board}/firmware.hex"
            if [ -f "$hex" ]; then
              python3 /tmp/uf2conv.py "$hex" -c -f 0xADA52840 -o "firmware/.pio/build/${board}/firmware.uf2"
            fi
          done

      - name: Collect firmware artifacts
        run: |
          for board in t_echo t_echo_plus heltec_t114 heltec_v3 t_deck t3s3; do
            mkdir -p "artifacts/${board}"
            src="firmware/.pio/build/${board}"
            [ -f "${src}/firmware.hex" ] && cp "${src}/firmware.hex" "artifacts/${board}/"
            [ -f "${src}/firmware.bin" ] && cp "${src}/firmware.bin" "artifacts/${board}/"
            [ -f "${src}/firmware.uf2" ] && cp "${src}/firmware.uf2" "artifacts/${board}/"
            [ -f "${src}/firmware.elf" ] && cp "${src}/firmware.elf" "artifacts/${board}/"
          done
          echo "Firmware artifacts:"
          find artifacts -type f -exec ls -lh {} \;

      - name: Upload t_echo_plus
        uses: actions/upload-artifact@v3
        with:
          name: firmware-t_echo_plus
          path: artifacts/t_echo_plus/
          retention-days: 30

      - name: Upload t_echo
        uses: actions/upload-artifact@v3
        with:
          name: firmware-t_echo
          path: artifacts/t_echo/
          retention-days: 30

      - name: Upload heltec_t114
        uses: actions/upload-artifact@v3
        with:
          name: firmware-heltec_t114
          path: artifacts/heltec_t114/
          retention-days: 30

      - name: Upload heltec_v3
        uses: actions/upload-artifact@v3
        with:
          name: firmware-heltec_v3
          path: artifacts/heltec_v3/
          retention-days: 30

      - name: Upload t_deck
        uses: actions/upload-artifact@v3
        with:
          name: firmware-t_deck
          path: artifacts/t_deck/
          retention-days: 30

      - name: Upload t3s3
        uses: actions/upload-artifact@v3
        with:
          name: firmware-t3s3
          path: artifacts/t3s3/
          retention-days: 30

  # ── Android: build debug APK + run unit tests ──────────────────────────────
  android:
    name: Android (debug APK + unit tests)
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: ~/Android/Sdk
          key: android-sdk-${{ hashFiles('tools/setup_android_env.sh') }}
          restore-keys: android-sdk-

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            android/.gradle-home
            android/.gradle
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts') }}
          restore-keys: gradle-

      - name: Install JDK 17
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless

      - name: Install protoc and regenerate proto sources
        run: |
          PROTOC_VER="34.1"
          PROTOC_ZIP="protoc-${PROTOC_VER}-linux-x86_64.zip"
          curl -fSL --progress-bar \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/${PROTOC_ZIP}" \
            -o "/tmp/${PROTOC_ZIP}"
          unzip -qo "/tmp/${PROTOC_ZIP}" -d /tmp/protoc
          cp /tmp/protoc/bin/protoc /usr/local/bin/
          rm -rf "/tmp/${PROTOC_ZIP}" /tmp/protoc
          protoc --version

          bash tools/proto_gen.sh --android-only

      - name: Setup Android environment
        run: |
          # Pin JAVA_HOME to the installed JDK 17
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"

          # Install Android command-line tools if not present
          if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fSL --progress-bar \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o /tmp/cmdline-tools.zip
            unzip -qo /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-tmp
            mv /tmp/cmdline-tools-tmp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-tmp
          fi

          # Accept licenses (suppress SIGPIPE from `yes` when sdkmanager exits)
          bash -c 'set +o pipefail; yes | "$1" --sdk_root="$2" --licenses > /dev/null 2>&1' _ "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_ROOT"

          # Install SDK packages (skip what is already present)
          bash -c 'set +o pipefail; yes | "$1" --sdk_root="$2" platform-tools "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1' _ "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_ROOT"

          # Write the env file so gradle_android.sh can pick it up
          printf 'JAVA_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > android/.android-env

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Clear stale test results
        run: |
          # Delete only the debug results dir the audit reads, so the rerun below produces
          # fresh reports. Absent on a clean checkout; idempotent. No mtime gate.
          rm -rf android/app/build/test-results/testDebugUnitTest

      - name: Run Android unit tests
        run: |
          # Single invocation runs the full `test` task (all unit-test variants) AND the debug
          # variant the audit reads (hardcoded testDebugUnitTest path). --rerun-tasks forces
          # re-execution so the audit never reads a reused report; the deletes above guarantee
          # freshness. Avoids running the task graph twice.
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export GRADLE_USER_HOME="$(pwd)/android/.gradle-home"
          cd android
          ./gradlew test :app:testDebugUnitTest --rerun-tasks --no-daemon

      - name: Audit test discovery (declared vs executed)
        run: |
          # Gated, not continued-on-error; argv is '.' (repo root), never an absolute path.
          test -f tools/audit_test_discovery.py || { echo "FAIL: tools/audit_test_discovery.py missing"; exit 1; }
          python3 tools/audit_test_discovery.py .

      - name: Build debug APK
        run: |
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export GRADLE_USER_HOME="$(pwd)/android/.gradle-home"
          cd android
          ./gradlew assembleDebug --no-daemon

      # Issue #14: Android 15+/16 devices may run a 16 KB page size. A native library whose
      # ELF PT_LOAD segments or in-archive data sit below 16 KB cannot be mapped there. This
      # measures the built APK rather than trusting Play's warning (which has named
      # libandroidx.graphics.path.so — a library that measured clean — while the real offender
      # was libmaplibre.so). The gate refuses to pass while any strict-ABI library is misaligned.
      - name: 16 KB page-size alignment gate (issue #14)
        run: |
          APK="$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "FAIL: no APK built"
            exit 1
          fi
          python3 tools/test_check_16kb_alignment.py
          python3 tools/check_16kb_alignment.py "$APK" --expect-clean

      - name: Collect APK artifacts
        run: |
          mkdir -p artifacts/android
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/android/ \;

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-debug-apk
          path: artifacts/android/
          retention-days: 30

  # ── Python tooling: offline, stdlib-only regression canaries (no JDK/SDK) ───
  # Runs the self-tests for the audit and the T.6 tile-fetcher. Both are offline + stdlib-only
  # (fixtures / fake fetch, never a real tile server). Separate from the android gradle audit
  # gate on purpose: a cheap canary that needs no gradle/JDK/SDK and does not depend on the
  # android job. No continue-on-error; a failing suite fails the job.
  python-tools:
    name: Python tooling regressions (offline)
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install python3
        run: apt-get update -qq && apt-get install -y -qq python3

      - name: Guard suite self-test (audit regression)
        run: |
          test -f tools/test_audit_test_discovery.py || { echo "FAIL: tools/test_audit_test_discovery.py missing"; exit 1; }
          python3 tools/test_audit_test_discovery.py

      - name: T.6 tile_fetch regressions
        run: |
          test -f tools/test_tile_fetch.py || { echo "FAIL: tools/test_tile_fetch.py missing"; exit 1; }
          python3 tools/test_tile_fetch.py

      - name: Firmware TFT patch regression tests
        run: |
          test -f firmware/scripts/test_patch_tft_espi_standalone.py || { echo "FAIL: firmware/scripts/test_patch_tft_espi_standalone.py missing"; exit 1; }
          python3 firmware/scripts/test_patch_tft_espi_standalone.py

      # MBTiles verifier/migrator regression suites (T6 tooling). stdlib-only, offline.
      # These land via the T6 toolchain commits; guard so they fail loudly (not silently skip)
      # if the files are absent, matching every other python-tools step.
      - name: ESP32 BLE memory-retention guard self-test
        run: python3 tools/test_check_ble_memory.py

      - name: MBTiles verifier regression tests
        run: |
          test -f tools/test_mbtiles_verify.py || { echo "FAIL: tools/test_mbtiles_verify.py missing"; exit 1; }
          python3 tools/test_mbtiles_verify.py

      - name: MBTiles migrator regression tests
        run: |
          test -f tools/test_mbtiles_migrate.py || { echo "FAIL: tools/test_mbtiles_migrate.py missing"; exit 1; }
          python3 tools/test_mbtiles_migrate.py

      - name: 16 KB alignment gate self-test
        run: |
          test -f tools/test_check_16kb_alignment.py || { echo "FAIL: tools/test_check_16kb_alignment.py missing"; exit 1; }
          python3 tools/test_check_16kb_alignment.py

      # Issue #7/#8: verify the vector-map verifier/crop helper are provably correct (a synthetic
      # pbf archive must verify, a raster or uncompressed one must fail, and crop must bound it).
      - name: vector-maps verifier/crop self-test
        run: |
          test -f tools/test_vector_mbtiles.py || { echo "FAIL: tools/test_vector_mbtiles.py missing"; exit 1; }
          python3 tools/test_vector_mbtiles.py

      # Issue #11: translation guards. Fails when a user-visible literal reappears in the
      # UI layer, or when values/ and values-de/ drift apart.
      - name: i18n — no hardcoded user-visible UI strings
        run: python3 tools/check_i18n.py .

      - name: i18n — generated string tables are current and locale-complete
        run: |
          python3 tools/i18n_strings.py android/app/src/main/res check
          python3 tools/i18n_help.py android/app/src/main/res check

  # ── Firmware: fast native unit-test canary (Unity, no ESP32 SDK) ─────────────
  # Cheap gate that runs the host-targeted Unity suite (platformio `native`) against
  # the pinned PlatformIO 6.2.0 venv. No JDK, no SDK, no ESP32 toolchain. Fails the
  # job on any failing test (pio test returns non-zero). "Only" the native tests here
  # (not the legacy monolithic `firmware` job, which still builds the nRF52 targets,
  # UF2 images and collects artifacts — kept intact so this job stays fast).
  firmware-native-tests:
    name: Firmware native unit tests (fast)
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache the venv + the global PlatformIO package/toolchain cache (the pioarduino
      # ESP32 platform and Xtensa toolchains live under ~/.platformio and are the slow
      # part). libdeps are NOT cached here — the native env's are small, and caching the
      # shared .pio/libdeps across the ESP32 matrix would thrash the same cache key.
      - name: Cache firmware venv + packages
        uses: actions/cache@v3
        with:
          path: |
            firmware/.venv
            ~/.platformio
          key: firmware-tools-v2-${{ hashFiles('firmware/requirements-dev.txt', 'firmware/platformio.ini') }}
          restore-keys: |
            firmware-tools-

      - name: Install Python venv tooling
        run: apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip

      - name: Setup firmware environment
        run: |
          bash ./tools/setup_firmware_env.sh
          echo "$(pwd)/firmware/.venv/bin" >> "$GITHUB_PATH"

      - name: Run native firmware unit tests (Unity)
        run: |
          test -f tools/pio_firmware.sh || { echo "FAIL: tools/pio_firmware.sh missing"; exit 1; }
          bash ./tools/pio_firmware.sh test -e native

  # ── Firmware: ESP32-S3 compile/link build matrix + BLE memory gate ───────────
  # Builds every ESP32-S3 env (compile/link only; upload is disabled or must not run)
  # and runs the BLE memory-retention guard on each produced ELF. Matrix legs run in
  # parallel and share the ~/.platformio + venv cache. `native` is excluded: it is the
  # unit-test env covered above and has no ESP32 ELF.
  firmware-esp32:
    name: Firmware ESP32 build (${{ matrix.env }})
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        env:
          - heltec_v4
          - t3s3
          - t_deck
          - heltec_v3
          - runtime_s3_shared
          - runtime_s3_v4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache firmware venv + packages
        uses: actions/cache@v3
        with:
          path: |
            firmware/.venv
            ~/.platformio
          key: firmware-tools-v2-${{ hashFiles('firmware/requirements-dev.txt', 'firmware/platformio.ini') }}
          restore-keys: |
            firmware-tools-

      - name: Install Python venv tooling
        run: apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip

      - name: Setup firmware environment
        run: |
          bash ./tools/setup_firmware_env.sh
          echo "$(pwd)/firmware/.venv/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.env }} (compile/link, no upload)
        run: |
          test -f tools/pio_firmware.sh || { echo "FAIL: tools/pio_firmware.sh missing"; exit 1; }
          bash ./tools/pio_firmware.sh run -e ${{ matrix.env }}

      - name: BLE memory-retention guard on ${{ matrix.env }} ELF
        run: |
          ELF="firmware/.pio/build/${{ matrix.env }}/firmware.elf"
          if [ ! -f "$ELF" ]; then
            echo "FAIL: $ELF was not produced by the build"; exit 1;
          fi
          python3 tools/check_ble_memory.py "$ELF"
