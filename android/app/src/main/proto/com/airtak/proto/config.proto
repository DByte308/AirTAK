// AirTAK — Airsoft Team Awareness Kit
// proto/airtak/config.proto — AirTAK device configuration schema
// Planning: §14.2, §9.4.1 | Roadmap: T.1
//
// Generated outputs: firmware/src/proto/ (nanopb), android/.../com/airtak/proto/ (Kotlin)
// Regenerate with: tools/proto_gen.ps1
//
// Config groups apply independently and without MCU reboot (§9.4).
// Groups requiring a radio restart (CHANNELS, LORA) trigger the controlled
// radio-restart procedure (≤ 300 ms, BLE connection preserved) — see §9.4.2.

syntax = "proto3";
package airtak;

option java_package = "com.airtak.proto";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

// ── Config group enumeration ───────────────────────────────────────────────────

// Identifies which config group is being read or written over BLE CONFIG_RW (§10.3).
enum ConfigGroup {
  DEVICE   = 0;
  LORA     = 1;
  CHANNELS = 2;
  POSITION = 3;
  POWER    = 4;
  GAME     = 5;
  SECURITY = 6;
  AUDIO    = 7;   // Phase 7: PTT audio settings
}

// ── Device ────────────────────────────────────────────────────────────────────

// Roadmap: 2.2 | NODEINFO_APP broadcast uses long_name and short_name.
message DeviceConfig {
  string long_name  = 1;   // max 39 UTF-8 bytes; broadcast in NODEINFO_APP
  string short_name = 2;   // max 4 UTF-8 bytes; broadcast in NODEINFO_APP
}

// ── LoRa ──────────────────────────────────────────────────────────────────────

// Region determines the operating frequency. Set once at first-time setup.
// Requires radio restart to change (§8.1).
enum LoraRegion {
  EU_868 = 0;   // 869.525 MHz default (EU sub-band g1 preferred)
  US_915 = 1;   // 906.875 MHz default
  AU_915 = 2;
  CN_470 = 3;
  JP_920 = 4;
  KR_920 = 5;
  IN_865 = 6;
}

// PHY profile: a named set of LoRa modulation parameters (§8.1).
// All nodes on a channel must share the same SF, BW, and CR to communicate.
// AirTAK exposes these raw values instead of Meshtastic's opaque preset names.
message PhyProfile {
  string name             = 1;   // user-visible name, max 16 bytes
  uint32 spreading_factor = 2;   // 7–12
  uint32 bandwidth_hz     = 3;   // 125000, 250000, or 500000
  uint32 coding_rate      = 4;   // 5=4/5  6=4/6  7=4/7  8=4/8

  // Factory defaults (indexes 0–4 in LoraConfig.profiles):
  //   [0] Long/Mesh:      SF=11 BW=250000 CR=5  (~= Meshtastic LONG_FAST)   3–8 km LOS
  //   [1] Short/Speed:    SF=7  BW=250000 CR=5  (~= Meshtastic SHORT_FAST)  0.5–2 km; audio-capable
  //   [2] Long/Reliable:  SF=12 BW=125000 CR=8  (~= Meshtastic LONG_SLOW)   5–15 km LOS
  //   [3] Medium/Slow:    SF=10 BW=250000 CR=5  (~= Meshtastic SHORT_SLOW)  2–5 km LOS (added v1.5)
  //   [4] User Defined:   all fields user-configurable
}

// Roadmap: 1.2 | Radio bring-up requires this config. Requires radio restart.
message LoraConfig {
  LoraRegion          region       = 1;
  uint32              tx_power_dbm = 2;   // 2–22 inclusive; default 22
  repeated PhyProfile profiles     = 3;   // exactly 5 entries; indexed by ChannelSlot.phy_profile_index
}

// ── Channels ──────────────────────────────────────────────────────────────────

enum ChannelRole {
  DISABLED  = 0;
  PRIMARY   = 1;
  SECONDARY = 2;
}

// Roadmap: 2.7 | One of 8 channel slots (index 0–7). See §8.5.
// Requires radio restart when PSK or phy_profile_index changes (§9.4.2).
message ChannelSlot {
  uint32      index              = 1;   // 0–7
  string      name               = 2;   // max 16 bytes
  bytes       psk                = 3;   // 16 or 32 bytes; empty = no encryption
  ChannelRole role               = 4;
  bool        uplink_enabled     = 5;   // forward received packets to phone via BLE MESH_RX
  bool        downlink_enabled   = 6;   // accept packets from phone via BLE MESH_TX
  uint32      position_precision = 7;   // 0–32 bits of lat/lng precision
  uint32      phy_profile_index  = 8;   // index into LoraConfig.profiles; default 0

  // Factory defaults:
  //   Slot 0: PRIMARY   "AirTAK"  profile=0  Meshtastic-interop + AirTAK game traffic
  //   Slot 1: SECONDARY "Tactical" profile=0  AirTAK tactical traffic (separate PSK)
  //   Slot 2: DISABLED  "Audio" profile=1  Pre-configured for Phase 7 PTT audio
  //   Slots 3–7: DISABLED
}

message ChannelConfig {
  repeated ChannelSlot slots = 1;   // exactly 8 entries
}

// ── Audio (Phase 7) ───────────────────────────────────────────────────────────

// Roadmap: 7.1–7.5 | PTT audio configuration.
// ptt_enabled=true activates the PTT button in the Android app.
// The firmware enforces that audio_channel_slot references a PHY profile
// with spreading_factor ≤ 8 before enabling PTT TX (§12.7).
message AudioConfig {
  uint32 audio_channel_slot = 1;   // which slot carries audio; default 2
  uint32 codec2_mode_bps    = 2;   // 700, 1300, or 2400; default 1300
  bool   ptt_enabled        = 3;   // master enable; false until user opts in
  uint32 frame_count        = 4;   // Codec2 frames per LoRa packet; default 8 (160 ms);
                                   // max 50; EU g1 compliance requires ≥ 42 (see §12.7)
}

// ── Position ──────────────────────────────────────────────────────────────────

// Roadmap: 2.4 | Smart beaconing policy (§8.7). No radio restart required.
message PositionConfig {
  uint32 broadcast_interval_secs = 1;   // heartbeat max; default 90
  uint32 gps_precision_bits      = 2;   // default 32 (full precision)
  bool   smart_broadcast         = 3;   // default true (movement-triggered; see §8.7)
  uint32 movement_threshold_m    = 4;   // fixed 10 m in Defaults.h; not user-configurable
  uint32 min_tx_interval_secs    = 5;   // minimum gap between TX; default 15
  uint32 position_hop_limit      = 6;   // override for POSITION_APP hop_limit; 0 = use firmware default (7)
}

// ── Power ─────────────────────────────────────────────────────────────────────

// Roadmap: 6.2 | GPS duty cycle for battery life target ≥ 8 h (§7.2, §6.3).
message PowerConfig {
  bool   gps_duty_cycle   = 1;   // false until Phase 6
  uint32 gps_on_secs      = 2;
  uint32 gps_off_secs     = 3;
  uint32 display_off_secs = 4;   // 0 = never off
}

// ── Game ──────────────────────────────────────────────────────────────────────

// Roadmap: 3.4, 5.1–5.2 | Per-player tactical coordination configuration. No radio restart.
// Unit hierarchy fields are free-text, self-assigned, all optional. No central enrollment.
message GameConfig {
  string callsign          = 1;   // max 16 bytes
  string fireteam_id       = 2;   // e.g., "Alpha"; free-text, optional
  string squad_id          = 3;   // e.g., "1st Squad"; free-text, optional
  string platoon_id        = 4;   // e.g., "Red Platoon"; free-text, optional
  string company_id        = 5;   // e.g., "1st Company"; free-text, optional
  uint32 player_color_rgb  = 6;   // 24-bit RGB; displayed on map pins
  bool   hit_button_enabled = 7;  // enable long-press HIT toggle on device button; default false
}

// ── Security ──────────────────────────────────────────────────────────────────

// Roadmap: 1.5 | BLE bond management. No radio restart required.
message SecurityConfig {
  uint32 max_bonded_devices = 1;   // 1–4; default 1
}
