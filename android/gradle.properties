# AirTAK Android — gradle.properties
# Planning: §11 | Roadmap: Phase 3

# JVM arguments for the Gradle daemon and Kotlin compiler.
# Kotlin 2.0 requires additional metaspace and Xmx for annotation processing.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Use the AndroidX libraries.
android.useAndroidX=true

# Enable non-transitive R classes for smaller builds.
android.nonTransitiveRClass=true

# Kotlin code style.
kotlin.code.style=official

# Build cache for faster incremental builds.
org.gradle.caching=true
org.gradle.parallel=true
