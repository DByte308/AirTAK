# AirTAK CI — GitHub Actions mirror (Android + Python tooling).
#
# Intended surface: the GitHub fork (origin = github.com/DByte308/AirTAK). The Forgejo
# workflow lives at .forgejo/workflows/ci.yml and is NOT seen by GitHub Actions — this file
# is the GHA-native counterpart. Firmware build matrix is a separate, optional future
# addition and is deliberately NOT duplicated here.
#
# Scope: Android (compileSdk 35 / targetSdk 35 unit tests + debug APK) and the offline
# Python tooling suites. No secrets. No pull_request_target. No privileged install of
# untrusted PR code. Least-privilege (contents: read).
name: AirTAK CI (GitHub)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run on the same ref (push->PR churn) — safe, never leaves two
# active runs writing the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Offline Python tooling suites (no JDK / SDK) ─────────────────────────────
  python-tools:
    name: Python tooling regressions (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard suite self-test (audit regression)
        run: |
          test -f tools/test_audit_test_discovery.py || { echo "FAIL: tools/test_audit_test_discovery.py missing"; exit 1; }
          python3 tools/test_audit_test_discovery.py

      - name: T.6 tile_fetch regressions
        run: |
          test -f tools/test_tile_fetch.py || { echo "FAIL: tools/test_tile_fetch.py missing"; exit 1; }
          python3 tools/test_tile_fetch.py

      - name: Firmware TFT patch regression tests
        run: |
          test -f firmware/scripts/test_patch_tft_espi_standalone.py || { echo "FAIL: firmware/scripts/test_patch_tft_espi_standalone.py missing"; exit 1; }
          python3 firmware/scripts/test_patch_tft_espi_standalone.py

      - name: ESP32 BLE memory-retention guard self-test
        run: python3 tools/test_check_ble_memory.py

      - name: MBTiles verifier regression tests
        run: |
          test -f tools/test_mbtiles_verify.py || { echo "FAIL: tools/test_mbtiles_verify.py missing"; exit 1; }
          python3 tools/test_mbtiles_verify.py

      - name: MBTiles migrator regression tests
        run: |
          test -f tools/test_mbtiles_migrate.py || { echo "FAIL: tools/test_mbtiles_migrate.py missing"; exit 1; }
          python3 tools/test_mbtiles_migrate.py

      # Issue #14: 16 KB alignment checker must be provably correct on its own, not just
      # exercised against whatever APK happened to build. The self-test builds synthetic
      # ELFs/ZIPs and asserts the checker fails the bad ones — the same property the gate
      # relies on. stdlib-only, offline.
      - name: 16 KB alignment gate self-test
        run: |
          test -f tools/test_check_16kb_alignment.py || { echo "FAIL: tools/test_check_16kb_alignment.py missing"; exit 1; }
          python3 tools/test_check_16kb_alignment.py

      # Issue #7/#8: the offline vector-map verifier and crop helper are the tools that certify
      # the Friedberg package. They must be provably correct, so a self-test builds a synthetic
      # vector MBTiles and asserts the verifier accepts a good pbf archive and rejects a raster
      # or uncompressed one, and that the crop helper produces a bounded archive that verifies.
      # stdlib-only, offline.
      - name: vector-maps verifier/crop self-test
        run: |
          test -f tools/test_vector_mbtiles.py || { echo "FAIL: tools/test_vector_mbtiles.py missing"; exit 1; }
          python3 tools/test_vector_mbtiles.py

      # Issue #11: the translation surface only stays translated if a new literal fails here.
      - name: i18n — no hardcoded user-visible UI strings
        run: python3 tools/check_i18n.py .

      - name: i18n — generated string tables are current and locale-complete
        run: |
          python3 tools/i18n_strings.py android/app/src/main/res check
          python3 tools/i18n_help.py android/app/src/main/res check

  # ── Android: committed generated sources, unit tests + audit + debug APK ─────
  android:
    name: Android (debug APK + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Commit generated sources (proto to java/kt) are what the build compiles; protoc is NOT
      # needed at build time for Gradle-generated java (protobuf-kotlin-lite runtime). Regeneration
      # reproducibility is tracked separately (future; needs exact generator version + normalization).
      - name: Install Android SDK platform 35 + build-tools 35.0.0 (explicit, matches compileSdk 35)
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDBIN="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$CMDBIN" ]; then
            echo "FAIL: sdkmanager not found under \$ANDROID_SDK_ROOT/cmdline-tools (path: $ANDROID_SDK_ROOT)"
            exit 1
          fi
          # License acceptance: suppress only the `yes` noise, but DO NOT suppress package
          # install errors (no `>/dev/null 2>&1` on the install call below).
          set +o pipefail
          yes | "$CMDBIN" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1
          set -o pipefail
          # Use explicit `--install` and surface errors/warnings (no output suppression).
          "$CMDBIN" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Clear stale test results (freshness)
        run: |
          rm -rf android/app/build/test-results/testDebugUnitTest

      - name: Run Android unit tests (all variants + debug, forced rerun)
        run: |
          export JAVA_HOME="${JAVA_HOME}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export GRADLE_USER_HOME="$(pwd)/android/.gradle-home"
          cd android
          ./gradlew test :app:testDebugUnitTest --rerun-tasks --no-daemon

      - name: Audit test discovery (declared vs executed)
        run: |
          test -f tools/audit_test_discovery.py || { echo "FAIL: tools/audit_test_discovery.py missing"; exit 1; }
          python3 tools/audit_test_discovery.py .

      - name: Build debug APK
        run: |
          export JAVA_HOME="${JAVA_HOME}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export GRADLE_USER_HOME="$(pwd)/android/.gradle-home"
          cd android
          ./gradlew assembleDebug --no-daemon

      # Issue #14: Android 15+/16 devices may run a 16 KB page size. A native library whose
      # ELF PT_LOAD segments or in-archive data sit below 16 KB cannot be mapped there. This
      # measures the built APK rather than trusting Play's warning (which has named
      # libandroidx.graphics.path.so, a library that measured clean, while the real offender
      # was libmaplibre.so). The gate refuses to pass while any strict-ABI library is misaligned.
      - name: 16 KB page-size alignment gate (issue #14)
        run: |
          APK="$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "FAIL: no APK built"
            exit 1
          fi
          python3 tools/test_check_16kb_alignment.py
          python3 tools/check_16kb_alignment.py "$APK" --expect-clean

      - name: Collect APK artifacts
        run: |
          mkdir -p artifacts/android
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/android/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/android/
          retention-days: 30
          if-no-files-found: error
