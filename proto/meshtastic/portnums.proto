// AirTAK — Airsoft Team Awareness Kit
// proto/meshtastic/portnums.proto — Vendored Meshtastic port number definitions
// Planning: §8.4, §13.3 | Roadmap: T.1
//
// DO NOT MODIFY — vendored from Meshtastic upstream at pinned commit (see VERSION).
// Standard Meshtastic portnums plus AirTAK private-range portnums are listed here
// for cross-reference. AirTAK-specific portnums are defined in proto/airtak/game.proto.

syntax = "proto3";
package meshtastic;

// Standard Meshtastic application port numbers used on channel 0.
// AirTAK private portnums (256–511) are defined in airtak/game.proto.
enum PortNum {
  // Unused/unknown
  UNKNOWN_APP = 0;

  // A simple UTF-8 text message (portnum 1).
  // AirTAK fully supports bidirectional text exchange with Meshtastic devices.
  TEXT_MESSAGE_APP = 1;

  // A GPS position packet (portnum 3).
  // AirTAK transmits POSITION_APP with smart beaconing (§8.7).
  POSITION_APP = 3;

  // Node identity information (portnum 4).
  // AirTAK broadcasts NODEINFO at startup and every 3 hours (§13.2).
  NODEINFO_APP = 4;

  // Device telemetry: battery, environment (portnum 67).
  TELEMETRY_APP = 67;

  // Hop-path tracing (portnum 71).
  TRACEROUTE_APP = 71;

  // Neighbor SNR table (portnum 73).
  NEIGHBORINFO_APP = 73;

  // AirTAK private range begins at 256. Defined in airtak/game.proto.
  // Values 256-511 are relayed by Meshtastic nodes but not decoded.
  PRIVATE_APP = 256;
}
