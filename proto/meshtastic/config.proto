// AirTAK — Airsoft Team Awareness Kit
// proto/meshtastic/config.proto — Vendored Meshtastic config definitions (minimal subset)
// Planning: §8.1, §13.3 | Roadmap: T.1
//
// DO NOT MODIFY — vendored from Meshtastic upstream at pinned commit (see VERSION).
// Only the subset used for NODEINFO interoperability is included here.
// AirTAK uses its own config schema (proto/airtak/config.proto) for all device settings.

syntax = "proto3";
package meshtastic;

// Hardware model identifier broadcast in NODEINFO_APP packets (§13.2).
// AirTAK devices identify as LILYGO_TECHO for Meshtastic app compatibility.
enum HardwareModel {
  UNSET         = 0;
  LILYGO_TECHO  = 43;   // LilyGo T-Echo family; value matches Meshtastic upstream
}

// Minimal NodeInfo for NODEINFO_APP interoperability (§13.2).
// AirTAK broadcasts this at startup and every 3 hours on channel 0.
message User {
  string         id          = 1;   // Node ID formatted as "!XXXXXXXX"
  string         long_name   = 2;   // Max 39 UTF-8 bytes from DeviceConfig
  string         short_name  = 3;   // Max 4 UTF-8 bytes from DeviceConfig
  bytes          macaddr     = 4;   // Lower 6 bytes of nRF52840 FICR device address
  HardwareModel  hw_model    = 6;   // Always LILYGO_TECHO for AirTAK devices
  bool           is_licensed = 7;   // Always false (not applicable to AirTAK)
}
