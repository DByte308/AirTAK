// AirTAK — Airsoft Team Awareness Kit
// proto/meshtastic/mesh.proto — Vendored Meshtastic mesh packet definitions
// Planning: §8.2, §8.3, §13.3 | Roadmap: T.1
//
// DO NOT MODIFY — vendored from Meshtastic upstream at pinned commit (see VERSION).
// AirTAK uses the Meshtastic wire format byte-for-byte (§8.2).

syntax = "proto3";
package meshtastic;

// The Data message is the decrypted payload carried inside a LoRa packet.
// AirTAK sends and receives this message on all channel slots.
// See §8.3 for encryption details (AES-128-CTR, key = SHA256(psk)[0:16]).
message Data {
  // Application port number identifying the payload type. See portnums.proto.
  uint32 portnum = 1;

  // The serialized application payload (e.g., a AirTAK game.proto message).
  bytes payload = 2;

  // Set true for ACKNOWLEDGED delivery class packets (§8.9).
  // When true, the receiver sends a AIRTAK_ACK (portnum 261) in reply.
  bool want_response = 3;

  // Destination node ID for unicast packets; 0 for broadcast.
  uint32 dest = 4;

  // Source node ID.
  uint32 source = 5;

  // Logical message ID used for ACK correlation and application-layer dedup (§8.9).
  // On first send: request_id == MeshPacket.id.
  // On retries: request_id stays the same; only MeshPacket.id changes (new random).
  uint32 request_id = 6;

  // Reply ID for response packets.
  uint32 reply_id = 7;

  // Optional emoji reaction ID.
  uint32 emoji = 8;
}

// MeshPacket represents the logical packet before LoRa encoding.
// The OTA wire format is defined in §8.2 — NOT this proto message.
// This message is used internally and in the BLE transport layer.
message MeshPacket {
  // Destination node ID. 0xFFFFFFFF = broadcast.
  uint32 to = 1;

  // Source node ID (derived from FICR.DEVICEID[0] per §8.8).
  uint32 from = 2;

  // Unique packet identifier. Changes on every retry for ACKNOWLEDGED packets.
  uint32 id = 3;

  // Hop limit: number of additional relay hops allowed. Decremented each hop.
  // Max 7. Default varies by packet type — see §8.7 hop-limit table.
  uint32 hop_limit = 4;

  // hop_start: original hop_limit set by the sender, preserved across all hops.
  // Flags bits [2:0] in the OTA wire format. Used by ACK receiver (§8.9).
  uint32 hop_start = 5;

  // want_ack: legacy L4 ack flag (unreliable in Meshtastic). AirTAK uses
  // AIRTAK_ACK (portnum 261) instead for reliable delivery. See §8.9.
  bool want_ack = 6;

  // The decrypted payload. On the wire, payload is encrypted (see §15.1).
  Data decoded = 7;
}
