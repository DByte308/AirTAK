// AirTAK — Airsoft Team Awareness Kit
// proto/airtak/game.proto — Player state, tactical markers, moderation, ack, audio
// Planning: §14.3, §8.4, §8.9, §12.1–§12.8 | Roadmap: T.2
//
// Generated outputs: firmware/src/proto/ (nanopb), android/.../com/airtak/proto/ (Kotlin)
// Regenerate with: tools/proto_gen.ps1
//
// Port numbers (256–263) are in the AirTAK private range; Meshtastic nodes relay
// but cannot decrypt them (different PSK on the channel slot).

syntax = "proto3";
package airtak;

option java_package = "com.airtak.proto";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

// ── Player (portnum 256) ──────────────────────────────────────────────────────

enum PlayerStatus {
  PLAYER_STATUS_ACTIVE     = 0;
  PLAYER_STATUS_INACTIVE   = 1;
  // Extended statuses (optional, manually toggled, informational only):
  PLAYER_STATUS_HIT        = 2;
  PLAYER_STATUS_RESPAWNING = 3;
  PLAYER_STATUS_ELIMINATED = 4;
}

// Roadmap: 2.11, 4.2, 5.2 | Sent on state transition (ACKNOWLEDGED) or heartbeat (BEST_EFFORT).
// is_state_transition distinguishes the two cases — critical for §8.9 ACK rule:
//   is_state_transition=true  → want_response=true  (ACKNOWLEDGED delivery)
//   is_state_transition=false → want_response=false (BEST_EFFORT heartbeat)
// Unit hierarchy fields are free-text, self-assigned, all optional.
message PlayerStatePacket {
  uint32       node_id             = 1;
  string       callsign            = 2;
  PlayerStatus status              = 3;
  uint32       color_rgb           = 4;
  bool         is_state_transition = 5;   // true = status changed; false = heartbeat
  string       fireteam_id         = 6;   // e.g., "Alpha"; free-text, optional
  string       squad_id            = 7;   // e.g., "1st Squad"; free-text, optional
  string       platoon_id          = 8;   // e.g., "Red Platoon"; free-text, optional
  string       company_id          = 9;   // e.g., "1st Company"; free-text, optional
}

// ── Tactical Markers (portnum 257) ─────────────────────────────────────────

enum MarkerType {
  MARKER_TYPE_POINT     = 0;   // single coordinate
  MARKER_TYPE_ROUTE     = 1;   // polyline (ordered series of points)
  MARKER_TYPE_AREA      = 2;   // polygon
  MARKER_TYPE_NOTE      = 3;   // text annotation at a coordinate
  MARKER_TYPE_OBJECTIVE = 4;   // objective with team-control fields
}

enum TeamControl {
  TEAM_CONTROL_OWN      = 0;
  TEAM_CONTROL_OPPOSING = 1;
  TEAM_CONTROL_NEUTRAL  = 2;
  TEAM_CONTROL_UNKNOWN  = 3;
}

enum Scope {
  SCOPE_ALL        = 0;
  SCOPE_COMPANY    = 1;
  SCOPE_PLATOON    = 2;
  SCOPE_SQUAD      = 3;
  SCOPE_FIRE_TEAM  = 4;
}

// WGS-84 coordinate pair.
message LatLng {
  double lat = 1;
  double lng = 2;
}

// Roadmap: 5.3, 5.4 | Tactical marker broadcast — any node can create/update/delete.
// ACKNOWLEDGED delivery; hop_limit=7. Scope filtering is receiver-side display logic.
// A marker with deleted=true removes the marker from display and storage.
message TacticalMarker {
  uint32          marker_id        = 1;
  MarkerType      type             = 2;
  string          label            = 3;   // max 32 chars
  string          description      = 4;   // max 256 chars, optional
  uint32          color_rgb        = 5;
  Scope           scope            = 6;
  uint32          creator_node_id  = 7;
  uint32          created_at_unix  = 8;
  uint32          updated_at_unix  = 9;
  bool            deleted          = 10;  // true = remove this marker
  repeated LatLng points           = 11;  // POINT/NOTE: 1; ROUTE: >=2; AREA: >=3
  // Objective-specific fields (meaningful only when type=OBJECTIVE):
  TeamControl     controlling_team = 12;  // OWN/OPPOSING/NEUTRAL/UNKNOWN
  uint32          priority         = 13;  // 0=info, 1=low, 2=medium, 3=high, 4=critical
}

// ── Moderation (portnum 258) ──────────────────────────────────────────────────

enum ModerationAction {
  MODERATION_ACTION_VOTE_BAN = 0;
  MODERATION_ACTION_UNBAN    = 1;
}

// Roadmap: 5.10 | Vote-kick / shadowban moderation. ACKNOWLEDGED delivery; hop_limit=7.
// Ban activates when 3 distinct voter_node_id values cast VOTE_BAN against the
// same target_node_id at the same scope. Ban expires after 24 h from most recent
// vote, or immediately on UNBAN from any previous voter. Ban effect is receiver-side
// display suppression only (shadowban); the mesh continues to relay all packets.
message ModerationPacket {
  ModerationAction action         = 1;
  uint32           target_node_id = 2;
  Scope            scope          = 3;   // scope at which the ban applies
  uint32           voter_node_id  = 4;
  uint32           timestamp_unix = 5;
}

// ── Application-layer ACK (portnum 261) ──────────────────────────────────────

// Roadmap: 2.11 | Application-layer acknowledgment for ACKNOWLEDGED-class packets.
// ack_request_id = Data.request_id of the packet being ACKed (NOT MeshPacket.id).
// hop_limit = hop_start of the original packet (Flags bits [2:0]); fallback 7.
// See §8.9 for full ACK flow, timeout formula, retry backoff.
message AirTAKAck {
  uint32 ack_request_id     = 1;   // Data.request_id of the ACKed packet
  uint32 from_node_id       = 2;   // node ID of the ACK sender
  uint32 original_hop_start = 3;   // hop_start of the ACKed packet; sender validation
}

// ── Position Request (portnum 262) ───────────────────────────────────────────

// Roadmap: 2.12, 5.6 | Unicast request to refresh a stale map pin.
// Target responds with POSITION_APP within 2 seconds. BEST_EFFORT; hop_limit=7.
message PositionRequestPacket {
  uint32 target_node_id    = 1;
  uint32 requester_node_id = 2;
}

// ── Sync Request (portnum 264) — Phase 5 ─────────────────────────────────
// Roadmap: 5.9+ | Late-joiner state synchronization.
// Sent by a device that just joined the mesh to request all active markers
// and recent text messages from already-connected nodes.
// Responders re-broadcast their markers and recent messages with jittered delay
// (200–800 ms per item) to prevent mesh flood.
// Hop_limit=7; BEST_EFFORT (no ACK — response is the implicit acknowledgment).
message SyncRequest {
  uint32 requester_node_id = 1;
  uint32 requested_types   = 2;    // bitmask: 1=MARKERS, 2=MESSAGES
}

// ── Overlay Alignment (portnum 265) ──────────────────────────────────────
// Roadmap: 5.x | Shares mission-overlay image corner alignment via mesh.
// The image binary is NOT transmitted — only corner geolocation and a hash
// so receivers can match against their own local copy of the same image.
// ACKNOWLEDGED delivery (want_response=true).

message OverlayAlignment {
  uint32 sharer_node_id   = 1;
  uint64 image_hash       = 2;    // first 8 bytes of SHA-256(image file)
  string image_file_name  = 3;    // original filename for human matching
  double top_left_lat     = 4;
  double top_left_lng     = 5;
  double top_right_lat    = 6;
  double top_right_lng    = 7;
  double bottom_right_lat = 8;
  double bottom_right_lng = 9;
  double bottom_left_lat  = 10;
  double bottom_left_lng  = 11;
  float  opacity          = 12;   // 0.1–1.0
  uint32 timestamp_unix   = 13;
}

// ── Marker Snapshot Request (portnum 266) ──────────────────────────────────
// Roadmap: 5.x | Unicast request to a specific node for a full marker dump.
// Sent ACKNOWLEDGED (want_response=true, 3 retries). The target responds by
// re-broadcasting all active markers individually via AIRTAK_TACTICAL.
// Marker-level dedup by (marker_id, updated_at_unix) handles duplicates.

message MarkerSnapshotRequest {
  uint32 target_node_id    = 1;
  uint32 requester_node_id = 2;
}

// ── PTT Audio (portnum 263) — Phase 7 ────────────────────────────────────────

// Roadmap: 7.3, 7.4 | Codec2-encoded PTT audio frame.
// MUST be sent on audio channel slot only (phy with spreading_factor ≤ 8).
// hop_limit MUST always be 1 — audio MUST NOT be relayed.
// FEC: fec_prev_audio_data MUST be empty on first packet of each session.
//   session_id enables boundary detection even when end_of_transmission is lost.
message AudioPacket {
  uint32 from_node_id        = 1;
  uint32 sequence_num        = 2;   // monotonically increasing per session; resets at session start
  uint32 codec2_mode_bps     = 3;   // must match AudioConfig.codec2_mode_bps
  bytes  audio_data          = 4;   // Codec2-encoded frames (frame_count frames)
  bool   end_of_transmission = 5;   // set on final packet of each PTT press
  bytes  fec_prev_audio_data = 6;   // MUST be empty on first packet of each session
  uint32 frame_count         = 7;   // number of Codec2 frames in audio_data
  uint32 session_id          = 8;   // increments by 1 per PTT press; wraps at 2^32
}
